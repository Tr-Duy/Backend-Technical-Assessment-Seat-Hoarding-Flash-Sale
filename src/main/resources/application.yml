spring:
  application:
    name: flash-sale-demo
  datasource:
    url: jdbc:mysql://localhost:3306/flashsale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:flashsale}
    password: ${DB_PASS:flashsale}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

flash-sale:
  challenge:
    secret: ${CHALLENGE_SECRET:demo-secret-change-in-production}
    min-human-ms: 200
    max-age-ms: 120000
  rate-limit:
    max-per-second: 5
  order:
    pay-timeout-minutes: 10
    expiry-job-interval-ms: 30000
  worker:
    threads: 4
